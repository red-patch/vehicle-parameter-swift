# XcodeGen 工程定义 —— 唯一事实来源，禁止手改生成的 .xcodeproj
# 改完本文件必须跑 `xcodegen generate`
name: VehicleParameter

options:
  bundleIdPrefix: com.vehicle.parameter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VehicleKit:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  VehicleParameter:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/ParameterGrid
    dependencies:
      - package: VehicleKit
        product: VehicleKit
      - package: GRDB
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 车辆参数工具
        CFBundleName: VehicleParameter
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vehicle.parameter.mac
        # 签名配置占位：本地开发 Automatic（无 Team 时 ad-hoc 签名可运行）；
        # M5 切换 Developer ID Application + 公证，届时填入团队与证书
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: "YES"

schemes:
  VehicleParameter:
    build:
      targets:
        VehicleParameter: all
    run:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
