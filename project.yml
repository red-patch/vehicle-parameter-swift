# XcodeGen 工程定义 —— 唯一事实来源，禁止手改生成的 .xcodeproj
# 改完本文件必须跑 `xcodegen generate`
name: VehicleParameter

options:
  bundleIdPrefix: com.vehicle.parameter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VehicleKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  VehicleParameter:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Features
      - path: App/ParameterGrid
    dependencies:
      - package: VehicleKit
        product: VehicleKit
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 车辆参数工具
        CFBundleName: VehicleParameter
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "5"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        # Sparkle 2 自动更新：M5 发布前填入真实 appcast 与 EdDSA 公钥
        SUFeedURL: https://red-patch.github.io/vehicle-parameter-swift/appcast.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vehicle.parameter.mac
        # 签名配置占位：本地开发 Automatic（无 Team 时 ad-hoc 签名可运行）；
        # M5 切换 Developer ID Application + 公证，届时填入团队与证书
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: "YES"
        # Apple Silicon 优先（brew libxlsxwriter 仅 arm64）；M5 分发前如需
        # Universal Binary，改用 SPM 源码编译 libxlsxwriter 再放开 ARCHS
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "YES"
        LIBRARY_SEARCH_PATHS: "$(inherited) /opt/homebrew/opt/libxlsxwriter/lib"

schemes:
  VehicleParameter:
    build:
      targets:
        VehicleParameter: all
    run:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
