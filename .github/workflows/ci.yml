name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vehiclekit:
    name: VehicleKit（swift build + swift test）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 安装 libxlsxwriter
        run: brew install libxlsxwriter
      - name: Swift 版本
        run: swift --version
      - name: 构建
        run: swift build
      - name: 单元测试
        run: swift test

  app:
    name: App 工程（xcodegen + xcodebuild）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: brew install xcodegen libxlsxwriter
      - name: 生成 Xcode 工程
        run: xcodegen generate
      - name: 校验工程已生成且可枚举 scheme
        run: |
          test -d VehicleParameter.xcodeproj
          xcodebuild -project VehicleParameter.xcodeproj -list
      - name: 构建 App（免签名，arm64）
        run: |
          xcodebuild -project VehicleParameter.xcodeproj \
            -scheme VehicleParameter \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO build
